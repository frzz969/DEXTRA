name: CI

# Satu tempat yang menjalankan semua pemeriksaan yang sudah ada.
# Tanpa ini, "113 tes lulus" adalah klaim dari mesin pengembang, bukan fakta repo.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Node + Python (unit, kontrak, paritas)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Pasang dependency (pnpm workspace)
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Pasang backend + pytest
        run: pip install -e ".[dev]"

      # Urutan pemeriksaan ada di scripts/test-all.mjs, bukan diulang di sini.
      # Kalau urutannya berubah, ubah satu tempat itu.
      - name: Semua pemeriksaan
        run: node scripts/test-all.mjs

  web:
    name: Next.js (apps/web) build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # apps/web adalah workspace pnpm penuh (lihat pnpm-workspace.yaml). Dulu ia
    # di-build terpisah dengan lockfile sendiri; sekarang dependency dipasang
    # dari root dan job ini hanya memfilter paket @dextra/web.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dextra/web run typecheck
      - run: pnpm --filter @dextra/web run build
