# Paritas dengan struktur target PRD v2.0.0 §11.
#
# Package manager yang berlaku di repo ini tetap **npm** — ada package-lock.json
# dan semua skrip di README memakai npm. Berkas ini disediakan agar struktur
# workspace bisa dibaca oleh tooling yang mengharapkan pnpm, dan agar migrasi ke
# pnpm (bila dibutuhkan) tidak menuntut penemuan ulang daftar workspace.
#
# Catatan: daftar di bawah adalah target pnpm, bukan keadaan npm sekarang. Di npm,
# `apps/web`, `apps/api`, dan `apps/worker` sengaja tidak menjadi workspace
# (symlink workspace gagal di Windows dengan EISDIR); lihat docs/MONOREPO-MAP.md §1.
packages:
  - "packages/*"
  - "apps/*"
